name: 'GoCD Jsonnet'
description: 'This action checks Jsonnet files to build, lint, fmt and ensure commited pipelines are up-to-date'
inputs:
  jsonnet-dir:
    description: 'The path for jsonnet files'
    required: true
    default: 'gocd/templates'
  generated-dir:
    description: 'The path for jsonnet files are rendered to'
    required: true
    default: 'gocd/generated-pipelines'
  render-as-single-file:
    descript: 'Whether to render as a single file or multiple'
    type: boolean
    default: true
    required: true
  jb-install:
    description: "When true, jb install will be run"
    type: boolean
    default: false
  check-for-changes:
    description: "If the generated pipelines are commited to your repo, set this to true to ensure the PR is up-to-date (i.e. the yaml has been built with all jsonnet changes)"
    type: boolean
    default: false
  convert-to-yaml:
    description: "If the generated pipelines should be converted from json to yaml"
    type: boolean
    default: false
  render-jsonnet-files:
    description: "Whether the action should render jsonnet files"
    type: boolean
    default: true
runs:
  using: "composite"
  steps:
    - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6

    # Pinned prebuilt release binaries (linux/amd64) instead of compiling
    # them with `go install ...@latest` on every run (~60s).
    # sha256s: go-jsonnet and yq from the upstream release checksum files;
    # jsonnet-bundler publishes none, so jb's is of the v0.6.0 release asset.
    - name: Install Jsonnet
      shell: bash
      env:
        JSONNET_VERSION: "0.22.0"
        JSONNET_SHA256: e87a93ea44e34da92c15636205c7f2240bf3ac92d00ccb855dbb4e7e03ea6941
        JB_VERSION: "0.6.0"
        JB_SHA256: 78e54afbbc3ff3e0942b1576b4992277df4f6beb64cddd58528a76f0cd70db54
        YQ_VERSION: "4.54.1"
        YQ_SHA256: 8e34fc298390875de416e6a4afcb8cabeceb25d9aa8506c1a2f9353cf702ea5f
      run: |
        set -euo pipefail
        if [ "$RUNNER_OS" != "Linux" ] || [ "$RUNNER_ARCH" != "X64" ]; then
          echo "::error::action-gocd-jsonnet only supports Linux X64 runners (got $RUNNER_OS $RUNNER_ARCH)"
          exit 1
        fi

        bin="$RUNNER_TEMP/gocd-jsonnet-bin"
        mkdir -p "$bin"

        fetch() {
          curl -fsSL --retry 3 -o "$2" "$1"
          echo "$3  $2" | sha256sum -c -
        }

        fetch "https://github.com/google/go-jsonnet/releases/download/v${JSONNET_VERSION}/go-jsonnet_${JSONNET_VERSION}_linux_amd64.tar.gz" \
          "$RUNNER_TEMP/go-jsonnet.tar.gz" "$JSONNET_SHA256"
        tar -xzf "$RUNNER_TEMP/go-jsonnet.tar.gz" -C "$bin" jsonnet jsonnetfmt jsonnet-lint

        fetch "https://github.com/jsonnet-bundler/jsonnet-bundler/releases/download/v${JB_VERSION}/jb-linux-amd64" \
          "$bin/jb" "$JB_SHA256"

        fetch "https://github.com/mikefarah/yq/releases/download/v${YQ_VERSION}/yq_linux_amd64" \
          "$bin/yq" "$YQ_SHA256"

        chmod +x "$bin"/*
        echo "$bin" >> "$GITHUB_PATH"

    - name: jsonnet bundler install
      shell: bash
      if: ${{ inputs.jb-install == 'true' }}
      env:
        JSONNET_DIR: ${{ inputs.jsonnet-dir }}
      run: |
        cd "$JSONNET_DIR"
        jb install

    - name: jsonnetfmt
      id: jsonnetfmt
      shell: bash
      env:
        JSONNET_DIR: ${{ inputs.jsonnet-dir }}
      run: |
        set -eou pipefail

        # Remove multiple slashes from path
        ignore_path=$(echo "$JSONNET_DIR/vendor/*" | sed 's|/\+|/|g')
        for i in $(find "$JSONNET_DIR" -type f \( -name '*.libsonnet' -o -name '*.jsonnet' \) -not -path "$ignore_path" ); do
          echo -e "\n📋 Checking format of: $i\n";
          jsonnetfmt --test $i
        done

    - name: jsonnetfmt error
      shell: bash
      if: steps.jsonnetfmt.outcome == 'failure' && always()
      run: echo -e "\n\n⚠️ Please run 'jsonnetfmt -i **/*.jsonnet && jsonnetfmt -i **/*.libsonnet' to fix formatting issues.\n\n"

    - name: jsonnet-lint
      shell: bash
      env:
        JSONNET_DIR: ${{ inputs.jsonnet-dir }}
      run: |
        set -eou pipefail

        # Remove multiple slashes from path
        ignore_path=$(echo "$JSONNET_DIR/vendor/*" | sed 's|/\+|/|g')
        for i in $(find "$JSONNET_DIR" -type f \( -name '*.libsonnet' -o -name '*.jsonnet' \) -not -path "$ignore_path" ); do
          echo -e "\n🔬 Linting: $i\n";
          jsonnet-lint -J "$JSONNET_DIR/vendor" $i
        done

    - name: Remove existing pipelines to ensure we don't have lingering pipelines
      shell: bash
      env:
        GENERATED_DIR: ${{ inputs.generated-dir }}
      run: |
        rm -rf   "$GENERATED_DIR"
        mkdir -p "$GENERATED_DIR"

    - name: Render Multiple Files
      shell: bash
      if: ${{ inputs.render-jsonnet-files =='true' && inputs.render-as-single-file == 'false' }}
      env:
        JSONNET_DIR: ${{ inputs.jsonnet-dir }}
        GENERATED_DIR: ${{ inputs.generated-dir }}
      run: |
        set -eou pipefail

        ignore_path=$(echo "$JSONNET_DIR/vendor/*" | sed 's|/\+|/|g')
        for i in $(find "$JSONNET_DIR" -type f \( -name '*.jsonnet' \) -not -path "$ignore_path" ); do
          echo -e "\n🖨️ Rendering: $i\n";
          jsonnet \
            -J "$JSONNET_DIR/vendor" \
            --ext-code output-files=true \
            -m "$GENERATED_DIR" \
            $i;
        done

    - name: Render Single File
      shell: bash
      if: ${{ inputs.render-jsonnet-files =='true' && inputs.render-as-single-file == 'true' }}
      env:
        JSONNET_DIR: ${{ inputs.jsonnet-dir }}
        GENERATED_DIR: ${{ inputs.generated-dir }}
      run: |
        set -eou pipefail

        ignore_path=$(echo "$JSONNET_DIR/vendor/*" | sed 's|/\+|/|g')
        for i in $(find "$JSONNET_DIR" -type f \( -name '*.jsonnet' \) -not -path "$ignore_path" ); do
          echo -e "\n🖨️ Rendering: $i\n";
          jsonnet \
            -J "$JSONNET_DIR/vendor" \
            --ext-code output-files=false \
            -o "$GENERATED_DIR/all-pipelines.yaml" \
            $i;
        done

    - name: Convert json to yaml
      shell: bash
      if: ${{ inputs.convert-to-yaml == 'true' }}
      env:
        GENERATED_DIR: ${{ inputs.generated-dir }}
      run: |
        set -eou pipefail

        for i in $(find "$GENERATED_DIR" -type f \( -name '*.yaml' \) ); do
          echo -e "\n💱 Converting to yaml: $i\n";
          yq -p json -o yaml -i $i;
        done

    - name: Fail if generated pipelines have changed
      if: ${{ inputs.check-for-changes == 'true' }}
      shell: bash
      run: if [ -n "$(git status --porcelain)" ] ; then git status; exit 1; fi
